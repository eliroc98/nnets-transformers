[tool.poetry]
name = "nnets-transformer"
version = "0.1.0"
description = ""
authors = ["liz"]
readme = "README.md"
packages = [{include = "nnets_transformer", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
transformer-lens = {git = "https://github.com/TransformerLensOrg/TransformerLens.git", rev = "50ee38b9a20695e90b8ce6a4aa20fd509c8175d9"}
transformers = "^4.54.1"
ipywidgets = "^8.1.7"
seaborn = "^0.13.2"
plotly = "^6.2.0"
nbformat = "^5.10.4"
networkx = "^3.5"
pyvis = "^0.3.2"
ipykernel = "^6.30.1"
scipy = "^1.16.1"
tqdm = "^4.67.1"
joypy = "^0.2.6"
hydra-core = "1.3.2"
omegaconf = "2.3.0"


# Optional CPU-only dashboard (T09-T12): poetry install --with dashboard
[tool.poetry.group.dashboard]
optional = true

[tool.poetry.group.dashboard.dependencies]
dash = "^3"
dash-cytoscape = "^1"

# Optional browser interaction checks for the dashboard: poetry install --with dashboard-test
[tool.poetry.group.dashboard-test]
optional = true

[tool.poetry.group.dashboard-test.dependencies]
selenium = ">=4.27,<4.36"

[tool.poetry.scripts]
nnets-transformer = "nnets_transformer.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
